<!DOCTYPE html>
<html>
<head>
  <title>PlayBlox Game</title>
  <style>
    body {
      margin: 0;
      background: #0f1117;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    header {
      padding: 20px;
      background: #181b25;
      font-size: 28px;
      font-weight: bold;
    }

    .game {
      margin: 50px auto;
      width: 80%;
      max-width: 800px;
      height: 400px;
      background: linear-gradient(135deg, #00a2ff, #764ba2);
      border-radius: 20px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    button {
      padding: 15px 30px;
      border: none;
      border-radius: 10px;
      font-size: 18px;
      cursor: pointer;
    }
  </style>
</head>

<body>

<header>🎮 PlayBlox Game</header>

<div class="game">
  <h1>Welcome to Blox City! 🏙️</h1>
  <p>Your PlayBlox adventure starts here.</p>
  <button onclick="alert('Game starting! 🚀')">Play Game</button>
</div>

</body>
</html>
